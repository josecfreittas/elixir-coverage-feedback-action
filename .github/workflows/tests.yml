name: Node.js CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm run test
      env:
        CI: true
